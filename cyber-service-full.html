      theme: {
        extend: {
          colors: {
            cyberDark: '#05070e',
            cyberNavy: '#080d1a',

            cyberPink: '#ff007f',
            cyberGreen: '#00ff88',
            cyberAmber: '#ffaa00',
            cyberPurple: '#a855f7'
          },
          fontFamily: {
            hud: ['Orbitron', 'sans-serif'],
            code: ['JetBrains Mono', 'monospace'],

  <style>
    body {
      background-color: #05070e;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }

    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    .cyber-border {
      position: relative;
      background: rgba(8, 13, 26, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.35);
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.12), inset 0 0 18px rgba(0, 243, 255, 0.05);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }

    .cyber-btn {
      position: relative;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      cursor: pointer;
    }
    .cyber-btn:hover:not(:disabled) {
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.55);
      transform: translateY(-2px);
    }
    .cyber-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .cyber-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .gcard {

      border: 1px solid #1f2a44;

      cursor: default;

    }

    }

      text-shadow: 0 0 8px rgba(0, 255, 136, 0.7), 0 0 20px rgba(0, 255, 136, 0.4);

    /* ===== Полигон (мини-игры) ===== */

  <script>
    // ==========================================
    // 1. WEB AUDIO SYNTHESIZER & BIOS BEEPS
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      tone(freq, dur, type = 'sine', vol = 0.16, delay = 0) {
        if (this.muted) return;
        this.init();
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }
      playClick() { this.tone(880, 0.05, 'sine', 0.14); }
      playBuzzer() { this.tone(140, 0.24, 'sawtooth', 0.2); }
      playPowerUp() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(920, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
      }
      playFanfare() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.28, 'sine', 0.18, i * 0.11));
      }
      playAirBlow() {
        if (this.muted) return;
        this.init();
        const bufferSize = this.ctx.sampleRate * 0.25;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }
      // Pattern: array of 'L' (long 0.45s) and 'S' (short 0.14s)
      playBiosPattern(pattern) {
        if (this.muted) return;
        this.init();
        let offset = 0;
        pattern.forEach(p => {
          const dur = p === 'L' ? 0.45 : 0.14;
          this.tone(800, dur, 'square', 0.18, offset);
          offset += dur + 0.16;
        });
      }
    }
    const audio = new SoundEngine();

    // ==========================================
    // 2. BACKGROUND CIRCUIT CANVAS
    // ==========================================
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = bgCanvas.getContext('2d');
    let width = bgCanvas.width = window.innerWidth;
    let height = bgCanvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      width = bgCanvas.width = window.innerWidth;
      height = bgCanvas.height = window.innerHeight;
    });
    const particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      r: Math.random() * 2 + 1
    }));
    function renderBg() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.035)';
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
      for (let y = 0; y < height; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
      ctx.fillStyle = '#00f3ff';
      particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const d = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (d < 115) {
            ctx.strokeStyle = `rgba(0, 243, 255, ${0.14 * (1 - d / 115)})`;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          }
        }
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // ==========================================
    // 3. SCORE, CONFETTI & HELPERS
    // ==========================================
    let score = 0;
    const completedStages = new Set();
    function addScore(pts, stageKey = null) {
      if (stageKey && completedStages.has(stageKey)) return;
      if (stageKey) completedStages.add(stageKey);
      score += pts;
      document.getElementById('scoreBadge').textContent = '⭐ ' + score;
    }
    function confetti() {
      for (let i = 0; i < 28; i++) {
        const s = document.createElement('span');

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= slidesData.length) idx = slidesData.length - 1;
      currentSlideIdx = idx;
      const slide = slidesData[currentSlideIdx];

      if (slide.invKey) {
        unlockedBadges.add(slide.invKey);
        updateInventoryHUD();
      }

      document.getElementById('slideCounter').innerText = `${String(slide.id).padStart(2, '0')} / ${String(slidesData.length).padStart(2, '0')}`;
      document.getElementById('slideTitleMin').innerText = slide.title;
      const pct = ((currentSlideIdx + 1) / slidesData.length) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;

      const statusText = document.getElementById('systemStatusText');
      if (currentSlideIdx === slidesData.length - 1) {
        statusText.innerText = 'ФИНАЛ СМЕНЫ';
        statusText.className = 'text-cyberGreen';
      } else {
        statusText.innerText = `СМЕНА: ${Math.round(pct)}%`;
        statusText.className = 'text-cyberCyan';
      }

      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = slide.render();
      if (viewport.firstElementChild) viewport.firstElementChild.classList.add('fx-in');
      if (slide.onShow) setTimeout(slide.onShow, 0);

      document.getElementById('teacherContent').innerHTML = slide.teacher;
      document.getElementById('prevBtn').disabled = currentSlideIdx === 0;
      document.getElementById('nextBtn').innerHTML = currentSlideIdx === slidesData.length - 1

      audio.playClick();

function choice(box,opts,why,pts,cb){
  const o=sh(opts.map((t,i)=>[t,i===0]));let wrong=0,solved=false;
  box.innerHTML=o.map((x,i)=>'<button class="opt" data-i="'+i+'">'+x[0]+'</button>').join('')+'<div class="fb"></div>';
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(solved)return;const fb=box.querySelector('.fb');
    if(o[b.dataset.i][1]){solved=true;b.classList.add('ok');audio.playPowerUp();add(Math.max(pts-2*wrong,1));
      fb.innerHTML='✅ '+why+'<br><button class="btn">Дальше</button>';fb.querySelector('.btn').onclick=cb}
    else{wrong++;audio.playBuzzer();b.classList.add('bad');b.disabled=true;fb.textContent='❌ Не то. Подумай ещё!'}
  });
}

function match(id,t,intro,P,end,pts){
  let sel=null,n=0;
  const L=sh(P.map((p,i)=>[p[0],i])),R=sh(P.map((p,i)=>[p[1],i]));
  view('<h2>'+t+'</h2><div class="card say">'+intro+'</div><div class="pair"><div id="l">'+L.map(x=>'<button class="opt" data-i="'+x[1]+'">'+x[0]+'</button>').join('')+'</div><div id="r">'+R.map(x=>'<button class="opt" data-i="'+x[1]+'">'+x[0]+'</button>').join('')+'</div></div><div class="fb" id="fb">Начни!</div>');
  $('#l').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{$('#l').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel')});
  $('#r').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(!sel){$('#fb').textContent='Сначала выбери элемент слева.';return}
    if(sel.dataset.i==b.dataset.i){add(pts);sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel.disabled=b.disabled=true;$('#fb').textContent='✅ '+P[b.dataset.i][2];sel=null;
      if(++n==P.length)$('#fb').innerHTML+='<br><button class="btn" id="nx">Готово</button>',$('#nx').onclick=()=>fin(id,end)}
    else{$('#fb').textContent='❌ Нет, подумай ещё.'}
  });
}
function qset(id,t,qs,end,pts){
  let i=0;
  (function next(){
    if(i>=qs.length)return fin(id,end);
    const q=qs[i];
    view('<h2>'+t+': '+(i+1)+' из '+qs.length+'</h2><div class="card say">'+q[0]+'</div><div id="ch"></div>');
    choice($('#ch'),q[1],q[2],pts,()=>{i++;next()});
  })();
}
function order(id,t,intro,steps,end){
  const o=sh(steps);let g=[];
  view('<h2>'+t+'</h2><div class="card say">'+intro+'</div><div class="clue" id="ok"></div><div id="bx"></div><div class="fb" id="fb"></div>');
  (function draw(){
    const rest=o.filter(s=>!g.includes(s));
    $('#ok').innerHTML=g.map((s,i)=>'<div>'+(i+1)+'. ✅ '+s+'</div>').join('')||'Нажимай шаги по порядку: сначала самый первый.';
    $('#bx').innerHTML=rest.map(s=>'<button class="opt">'+s+'</button>').join('');
    $('#bx').querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>{
      if(rest[i]===steps[g.length]){g.push(rest[i]);add(3);$('#fb').textContent='';draw()}
      else{add(-1);$('#fb').textContent='❌ Это не сейчас. Что должно идти раньше?'}
    });
    if(g.length==steps.length){$('#fb').innerHTML='<button class="btn">Готово</button>';$('#fb').firstChild.onclick=()=>fin(id,end)}
  })();
}

function binary(){
  const T=[3,6,9,13,22];let i=0;
  (function next(){
    if(i>=T.length)return fin('bi','Компьютер хранит всё нулями и единицами: числа, буквы, картинки. Например, 13 = 1101, а 22 = 10110.');
    const t=T[i],n=t>15?5:4;let bits=Array(n).fill(0);
    view('<h2>Лампочки '+(i+1)+' из '+T.length+'</h2><div class="card say">Лампочка горит (1) или нет (0). Каждая стоит вдвое больше соседней. Зажги лампочки так, чтобы сумма была <b>'+t+'</b>.</div><div id="lp"></div><div class="clue" id="cl"></div>');
    (function draw(){
      const sum=bits.reduce((s,b,k)=>s+b*2**(n-1-k),0);
      $('#lp').innerHTML=bits.map((b,k)=>'<button class="lamp'+(b?' on':'')+'">'+2**(n-1-k)+'<br>'+b+'</button>').join('');
      $('#lp').querySelectorAll('.lamp').forEach((l,k)=>l.onclick=()=>{bits[k]^=1;draw()});
      $('#cl').innerHTML='Сумма: <b>'+sum+'</b> из '+t+(sum==t?' ✅ <button class="btn" id="ok">Верно, дальше</button>':'');
      if(sum==t)$('#ok').onclick=()=>{add(5);i++;next()};
    })();
  })();
}
