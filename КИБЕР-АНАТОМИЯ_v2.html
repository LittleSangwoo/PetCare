  <style>
    /* Cyberpunk Scanlines & Vignette */
    body {
      background-color: #05070e;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
      font-family: 'Inter', sans-serif;
    }
    
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    .cyber-border {
      position: relative;
      background: rgba(8, 13, 26, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    .cyber-btn {
      position: relative;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    }
    .cyber-btn:hover {
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
      transform: translateY(-2px);
    }
    .cyber-btn:active {
      transform: translateY(1px);
    }

    .neon-text-cyan {
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.4);
    }
    .neon-text-pink {
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.4);
    }
    .neon-text-green {
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.7), 0 0 20px rgba(0, 255, 136, 0.4);
    }

    /* Custom range slider */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(0, 243, 255, 0.15);
      height: 8px;
      border-radius: 4px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #00f3ff;
      cursor: pointer;
      box-shadow: 0 0 12px #00f3ff;

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #00f3ff44;
      border-radius: 3px;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 15px #00f3ff); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 2.5s infinite;
    }
  @keyframes fxIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.fx-in{animation:fxIn .45s ease-out}
@keyframes glitch{0%,90%,100%{transform:none;text-shadow:none}92%{transform:translate(-2px,1px);text-shadow:2px 0 #ff007f,-2px 0 #00f3ff}96%{transform:translate(2px,-1px);text-shadow:-2px 0 #ff007f,2px 0 #00f3ff}}
.glitch{animation:glitch 3s infinite}
.gcard{background:rgba(8,13,26,.9);border:1px solid #1f2a44;border-radius:10px;transition:.15s;cursor:pointer}
.gcard:hover{border-color:#00f3ff;box-shadow:0 0 14px #00f3ff55;transform:translateY(-2px)}
.gcard:disabled{cursor:default;opacity:.9}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.conf{position:fixed;top:-30px;z-index:60;font-size:26px;pointer-events:none;animation:conf 2.6s ease-in forwards}

  <!-- Web Audio Synthesizer Engine & Logic Script -->
  <script>
    // ==========================================
    // 1. SOUND FX ENGINE (Web Audio API)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playBuzzer() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      playPowerUp() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.6);
      }
      playFanfare() {
        if (this.muted) return;
        this.init();
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.3);
        });
      }
      playTyping() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200 + Math.random() * 400, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      }
    }
    const audio = new SoundEngine();

    // ==========================================
    // 2. BACKGROUND CANVAS (Pulsing Grid / Circuit)
    // ==========================================
    const bgCanvas = document.getElementById('bgCanvas');
    const ctx = bgCanvas.getContext('2d');
    let width = bgCanvas.width = window.innerWidth;
    let height = bgCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = bgCanvas.width = window.innerWidth;
      height = bgCanvas.height = window.innerHeight;
    });

    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        size: Math.random() * 2 + 1
      });
    }

    function renderBg() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
      ctx.lineWidth = 1;

      // Draw subtle grid
      const step = 60;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Draw floating nodes & connections
      ctx.fillStyle = '#00f3ff';
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        for (let j = idx + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 120) {
            ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 * (1 - dist / 120)})`;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // ==========================================
    // 3. SLIDES & TEACHER GUIDE DATA
    // ==========================================
    const slidesData = [
      // SLIDE 1
      {
        id: 1,
        title: "ПРОЛОГ: СБОЙ СИСТЕМЫ",
        invKey: null,
        render: () => `
          <div class="cyber-border w-full p-8 md:p-12 text-center flex flex-col items-center justify-center max-w-4xl animate-fadeIn">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-500/10 border border-red-500/40 text-red-400 font-code text-xs mb-6 tracking-widest animate-pulse">
              <i class="fa-solid fa-triangle-exclamation"></i> КРИТИЧЕСКИЙ СБОЙ: ПИТАНИЕ ОТКЛЮЧЕНО
            </div>
            <h1 class="font-hud font-black text-3xl md:text-5xl text-white tracking-wider mb-4 leading-tight">
              КИБЕР-АНАТОМИЯ:<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyberCyan via-teal-300 to-cyberPink neon-text-cyan">ОЖИВЛЕНИЕ ТИТАНА</span>
            </h1>
            <p class="font-sans text-gray-300 text-base md:text-lg max-w-2xl mb-8 leading-relaxed">
              Перед нами заснувший суперкомпьютер. Наш старый боевой ПК в классе полностью разобран. Твоя миссия — за 30 минут изучить каждый орган машины, собрать узлы воедино и запустить сердце Титана кодом на Python!
            </p>
            <div class="flex flex-wrap gap-4 justify-center">
              <button onclick="nextSlide()" class="cyber-btn px-8 py-3.5 bg-cyberCyan hover:bg-cyan-400 text-cyberDark font-hud font-black text-sm tracking-widest shadow-[0_0_20px_rgba(0,243,255,0.6)]">
                <i class="fa-solid fa-power-off mr-2"></i> НАЧАТЬ ДИАГНОСТИКУ
              </button>
            </div>
          </div>
        `,
        teacher: `
          <div class="space-y-3">
            <h4 class="font-hud text-cyberPurple font-bold">🎯 ЦЕЛЬ СЛАЙДА:</h4>
            <p>Заинтриговать пятиклассника, вовлечь в сюжет кибер-миссии. Ребенок не «учит скучные детали», а спасает шаттл.</p>
            <h4 class="font-hud text-cyberCyan font-bold">🗣 ЧТО СКАЗАТЬ:</h4>
            <p class="italic text-gray-300">«Смотри на стол. Это наш Титан. Сейчас это просто холодный железный ящик. Чтобы заставить его летать и играть в игры, мы должны оживить его изнутри!»</p>
            <h4 class="font-hud text-cyberGreen font-bold">🛠 ПРАКТИКА В КЛАССЕ:</h4>
            <p>Поставить перед учеником старый закрытый системный блок. Показать отвертку. Дать понять, что сегодня он будет крутить винты сам.</p>
          </div>
        `
      },

      // SLIDE 2 - MOTHERBOARD
      {
        id: 2,
        title: "МИССИЯ 01: МАТЕРИНСКАЯ ПЛАТА",
        invKey: "mobo",
        render: () => `
          <div class="cyber-border w-full p-6 md:p-8 flex flex-col md:flex-row gap-6 items-center max-w-5xl">
            <div class="flex-1 space-y-4">
              <div class="inline-block px-3 py-1 bg-cyberCyan/10 border border-cyberCyan/40 text-cyberCyan text-xs font-code tracking-widest">УЗЕЛ 01 // МАТЕРИНСКАЯ ПЛАТА</div>
              <h2 class="font-hud text-2xl md:text-3xl font-black text-white">КИБЕР-МЕГАПОЛИС</h2>
              <p class="text-sm md:text-base text-gray-300">Материнская плата (Motherboard) — огромная равнина с миллионами медных скоростных шоссе (шин данных). Она связывает всех жителей компьютера воедино.</p>
              
              <div class="p-3 bg-cyberNavy/80 border border-cyberCyan/20 rounded font-code text-xs space-y-2">
                <div class="text-cyberGreen font-bold"><i class="fa-solid fa-gamepad mr-1"></i> ИНТЕРАКТИВ: Нажми на сокеты на схеме справа!</div>
                <div id="moboDetails" class="text-cyberCyan">Статус: выбери сектор на карте...</div>
              </div>

      document.getElementById('progressBar').style.width = `${percent}%`;

      // Status text
      const statusText = document.getElementById('systemStatusText');
      if (slide.id === 1) {
        statusText.innerText = 'CORE: OFFLINE';
        statusText.className = 'text-red-400';
      } else if (currentSlideIdx === slidesData.length - 1) {
        statusText.innerText = 'CORE: FULLY OPERATIONAL';
        statusText.className = 'text-cyberGreen';
      } else {
        statusText.innerText = `PROGRESS: ${Math.round(percent)}%`;
        statusText.className = 'text-cyberCyan';
      }

      // Render Viewport
      const viewport = document.getElementById('slideViewport');
      viewport.innerHTML = slide.render();
      if (viewport.firstElementChild) viewport.firstElementChild.classList.add('fx-in');
      if (slide.onShow) setTimeout(slide.onShow, 0);

      // Render Teacher Content
      const teacherContainer = document.getElementById('teacherContent');
      teacherContainer.innerHTML = slide.teacher;

      // Disable/enable prev/next buttons
      document.getElementById('prevBtn').disabled = currentSlideIdx === 0;
      document.getElementById('nextBtn').innerText = currentSlideIdx === slidesData.length - 1 ? 'ФИНИШ 🏆' : 'ДАЛЕЕ ▶';

      audio.playClick();
    }

const qzShow=()=>{if(qz.i>=5){addScore(qz.ok*4);if(qz.ok>=4)confetti();const r=qz.ok==5?'КИБЕР-ИНЖЕНЕР':qz.ok>=3?'ТЕХНИК-ПИЛОТ':'КАДЕТ';say('qzBox',`<div class="font-hud text-xl text-cyberGreen">${qz.ok} / 5 · ранг: ${r}</div><div class="text-cyberAmber mt-2">Всего очков за урок: ⭐ ${score}</div><button class="${BTN} mt-4" onclick="qzInit()">ЕЩЁ РАЗ</button>`);return;}
 const q=QZ[qz.i];say('qzBox',`<div class="font-hud text-white mb-3">${qz.i+1}/5 · ${q[0]}</div><div class="grid gap-3 sm:grid-cols-3">${q[1].map((o,k)=>`<button class="gcard p-3 text-sm text-white" onclick="qzPick(${k})">${o}</button>`).join('')}</div>`);};
window.qzPick=k=>{if(k==QZ[qz.i][2]){qz.ok++;audio.playPowerUp();}else audio.playBuzzer();qz.i++;qzShow();};
